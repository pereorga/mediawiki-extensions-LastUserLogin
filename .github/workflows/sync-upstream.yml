name: Sync Upstream PR

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Fetch upstream and check for updates
        run: |
          git remote add upstream https://github.com/wikimedia/mediawiki-extensions-LastUserLogin.git
          git fetch upstream master

          # Create or update a sync branch tracking upstream
          git checkout -B upstream-sync upstream/master
          git push -u origin upstream-sync --force

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only create PR if upstream-sync has commits not in master
          if [ $(git rev-list --count master..upstream-sync) -gt 0 ]; then
            gh pr create \
              --base master \
              --head upstream-sync \
              --title "chore: sync with upstream" \
              --body "Automated PR to sync changes from upstream." || echo "PR already exists or updated"
          else
            echo "No new commits from upstream."
          fi
